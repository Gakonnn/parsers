services:
  postgres:
    image: postgres:16-alpine
    container_name: olx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parsers}
      POSTGRES_USER: ${POSTGRES_USER:-parsers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parsers}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parsers} -d ${POSTGRES_DB:-parsers}"]
      interval: 10s
      timeout: 5s
      retries: 10

  selenium:
    image: selenium/standalone-chrome:4.33.0
    platform: linux/amd64
    container_name: olx-selenium
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "${SELENIUM_PORT:-4444}:4444"
      - "${SELENIUM_VNC_PORT:-7900}:7900"
    environment:
      SE_NODE_MAX_SESSIONS: 1
      SE_NODE_OVERRIDE_MAX_SESSIONS: true

  redis:
    image: redis:7-alpine
    container_name: parsers-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  parsers_hub:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olx-parsers-hub
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      selenium:
        condition: service_started
    environment:
      PARSERS_HUB_HOST: 0.0.0.0
      PARSERS_HUB_PORT: 8090
      PARSERS_PROJECT_ROOT: /app
      PARSERS_PYTHON_BIN: /usr/local/bin/python
      PARSERS_HUB_DATABASE_URL: ${DATABASE_URL:-postgresql://parsers:parsers@postgres:5432/parsers}
      DATABASE_URL: ${DATABASE_URL:-postgresql://parsers:parsers@postgres:5432/parsers}
      CHROME_BINARY: /usr/bin/chromium
      CHROMIUM_BINARY: /usr/bin/chromium
      TZ: ${TZ:-Asia/Almaty}
    ports:
      - "${PARSERS_HUB_PORT:-8090}:8090"
    volumes:
      - ./parsers_hub/runs:/app/parsers_hub/runs
      - ./unified_runs:/app/unified_runs

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: parsers-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      BACKEND_DATABASE_URL: ${DATABASE_URL:-postgresql://parsers:parsers@postgres:5432/parsers}
      BACKEND_SECRET_KEY: ${BACKEND_SECRET_KEY:-change-me-in-production}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      BACKEND_AUTO_CREATE_TABLES: ${BACKEND_AUTO_CREATE_TABLES:-false}
      BACKEND_CELERY_BROKER_URL: ${BACKEND_CELERY_BROKER_URL:-redis://redis:6379/0}
      BACKEND_CELERY_RESULT_BACKEND: ${BACKEND_CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      PARSERS_HUB_INTERNAL_URL: ${PARSERS_HUB_INTERNAL_URL:-http://parsers_hub:8090}
      BACKEND_JOB_POLL_INTERVAL_SEC: ${BACKEND_JOB_POLL_INTERVAL_SEC:-2}
      BACKEND_FREE_PLAN_JOBS_PER_MONTH: ${BACKEND_FREE_PLAN_JOBS_PER_MONTH:-10}
      BACKEND_FREE_PLAN_RECORDS_PER_MONTH: ${BACKEND_FREE_PLAN_RECORDS_PER_MONTH:-500}
      BACKEND_FREE_PLAN_SOURCES: ${BACKEND_FREE_PLAN_SOURCES:-olx,krisha,2gis,kolesa}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-change-payment-webhook-secret}
      PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL:-}
      PAYMENT_CANCEL_URL: ${PAYMENT_CANCEL_URL:-}
      TZ: ${TZ:-Asia/Almaty}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  backend_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: parsers-backend-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      parsers_hub:
        condition: service_started
    environment:
      BACKEND_DATABASE_URL: ${DATABASE_URL:-postgresql://parsers:parsers@postgres:5432/parsers}
      BACKEND_SECRET_KEY: ${BACKEND_SECRET_KEY:-change-me-in-production}
      BACKEND_CELERY_BROKER_URL: ${BACKEND_CELERY_BROKER_URL:-redis://redis:6379/0}
      BACKEND_CELERY_RESULT_BACKEND: ${BACKEND_CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      PARSERS_HUB_INTERNAL_URL: ${PARSERS_HUB_INTERNAL_URL:-http://parsers_hub:8090}
      BACKEND_JOB_POLL_INTERVAL_SEC: ${BACKEND_JOB_POLL_INTERVAL_SEC:-2}
      BACKEND_FREE_PLAN_JOBS_PER_MONTH: ${BACKEND_FREE_PLAN_JOBS_PER_MONTH:-10}
      BACKEND_FREE_PLAN_RECORDS_PER_MONTH: ${BACKEND_FREE_PLAN_RECORDS_PER_MONTH:-500}
      BACKEND_FREE_PLAN_SOURCES: ${BACKEND_FREE_PLAN_SOURCES:-olx,krisha,2gis,kolesa}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-change-payment-webhook-secret}
      PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL:-}
      PAYMENT_CANCEL_URL: ${PAYMENT_CANCEL_URL:-}
      TZ: ${TZ:-Asia/Almaty}
    command: >
      celery -A app.worker.celery_app worker
      --loglevel=INFO
      --queues=parsers
      --concurrency=${BACKEND_WORKER_CONCURRENCY:-1}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: parsers-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      TZ: ${TZ:-Asia/Almaty}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: olx-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
